name: YouTube comment moderator

on:
  schedule:
    # GitHub の定期実行は15〜30分遅れることがあるため、1回の起動で約55分間、2分おきにチェックを続ける。
    # 起動は20分おきに予約し、実行中の回が終わると待機中の次の回がすぐ始まるので、切れ目なく見張れる。
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "YouTube を変更せず、通知も送らずにログで確認する"
        type: boolean
        default: false

concurrency:
  group: youtube-comment-moderator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  moderate:
    # 準備が終わるまでは動かさない。Settings → Secrets and variables → Actions → Variables で
    # MODERATOR_ENABLED を true にすると定期実行が始まる（手動実行はいつでも可）。
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MODERATOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: scripts/youtube-moderator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/youtube-moderator/package-lock.json

      - run: npm ci --omit=dev

      # 通知済みコメントIDの記録（本文は含まない）を実行間で引き継ぐ
      - uses: actions/cache/restore@v4
        with:
          path: scripts/youtube-moderator/.state
          key: yt-moderator-state-${{ github.run_id }}
          restore-keys: yt-moderator-state-

      - name: Moderate held comments
        run: npm start
        env:
          MODERATION_MODE: ${{ vars.MODERATION_MODE || 'suggest' }}
          NG_WORDS: ${{ vars.NG_WORDS }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          # 導入前（2026-10-08 02:20 JST より前）のコメントは審査しない
          IGNORE_BEFORE: ${{ vars.IGNORE_BEFORE || '2026-10-08T02:20:00+09:00' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # 定期実行のときだけ繰り返す（手動実行は1回で終わる）
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '55' || '0' }}
          INTERVAL_MINUTES: "2"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

      # 失敗した回でも連続失敗の回数を残すため always()
      - uses: actions/cache/save@v4
        if: ${{ always() && hashFiles('scripts/youtube-moderator/.state/state.json') != '' }}
        with:
          path: scripts/youtube-moderator/.state
          key: yt-moderator-state-${{ hashFiles('scripts/youtube-moderator/.state/state.json') }}
