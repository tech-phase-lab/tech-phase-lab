name: Billing dependencies external backup and boot

on:
  push:
    branches: [codex/research-preview]
    paths:
      - .github/workflows/billing-dependencies-external-backup.yml
      - docs/billing-dependencies-backup-request.txt

permissions:
  contents: read

concurrency:
  group: billing-dependencies-external-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'tech-phase-lab/tech-phase-lab' && github.ref == 'refs/heads/codex/research-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only Billing dependencies without backup credentials
        run: |
          npm ci --prefix services/tech-phase-billing --omit=dev --ignore-scripts --no-audit --no-fund
          python -m pip install -r services/tech-phase-backup/requirements.txt
      - name: Prepare Billing dependency package and matching source
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/billing-dependency-custody"
          python scripts/tech-phase/prepare_offline_dependencies.py --repo "$GITHUB_WORKSPACE/services/tech-phase-billing" --output "$RUNNER_TEMP/billing-dependency-custody/package"
          python scripts/tech-phase/prepare_source_recovery.py --repo "$GITHUB_WORKSPACE" --commit "$EXPECTED_COMMIT" --output "$RUNNER_TEMP/billing-dependency-custody/source"
      - name: Encrypt, upload, download and restore source and Billing dependencies
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          TECH_PHASE_SOURCE_UPLOAD_ENABLED: 'true'
          TECH_PHASE_DEPENDENCIES_UPLOAD_ENABLED: 'true'
          MIRROR_DESTINATION_ENDPOINT: ${{ secrets.MIRROR_DESTINATION_ENDPOINT }}
          MIRROR_DESTINATION_BUCKET: resolute-backup-external
          MIRROR_DESTINATION_REGION: auto
          MIRROR_DESTINATION_ACCESS_KEY_ID: ${{ secrets.MIRROR_DESTINATION_ACCESS_KEY_ID }}
          MIRROR_DESTINATION_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_DESTINATION_SECRET_ACCESS_KEY }}
          TECH_PHASE_EXTERNAL_KEY_HEX: ${{ secrets.TECH_PHASE_EXTERNAL_KEY_HEX }}
        run: |
          set -euo pipefail
          umask 077
          expected_lock=$(sha256sum services/tech-phase-billing/package-lock.json | cut -d ' ' -f1)
          python scripts/tech-phase/upload_source_recovery.py --package "$RUNNER_TEMP/billing-dependency-custody/source" --expected-commit "$EXPECTED_COMMIT" > "$RUNNER_TEMP/billing-dependency-custody/source-report.json"
          python scripts/tech-phase/external_dependencies.py --package "$RUNNER_TEMP/billing-dependency-custody/package" --expected-lock "$expected_lock" --output "$RUNNER_TEMP/billing-dependency-custody/restored" > "$RUNNER_TEMP/billing-dependency-custody/dependency-report.json"
          cat "$RUNNER_TEMP/billing-dependency-custody/source-report.json"
          cat "$RUNNER_TEMP/billing-dependency-custody/dependency-report.json"
      - name: Boot clean Billing with restored dependencies and networking disabled
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/billing-dependency-custody/boot"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/billing-dependency-custody/boot"
          mv "$RUNNER_TEMP/billing-dependency-custody/restored/node_modules" "$RUNNER_TEMP/billing-dependency-custody/boot/services/tech-phase-billing/node_modules"
          cd "$RUNNER_TEMP/billing-dependency-custody/boot"
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' -- env -i PATH="$PATH" node scripts/tech-phase/verify_billing_recovery.mjs
          echo '{"event":"BILLING_EXTERNAL_OFFLINE_BOOT_OK","network_disabled":true,"new_npm_install":false,"live_database_verified":false}'
          {
            echo 'Source and Billing dependencies restored from R2; isolated boot, auth rejection and disabled payment routes passed.'
            echo 'Live DB, authenticated storage, Node binary and full disaster recovery remain separate.'
            cat "$RUNNER_TEMP/billing-dependency-custody/source-report.json"
            cat "$RUNNER_TEMP/billing-dependency-custody/dependency-report.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private staging
        if: always()
        run: sudo rm -rf -- "$RUNNER_TEMP/billing-dependency-custody"
