name: Research preview checks

on:
  push:
    branches:
      - codex/research-preview
  pull_request:
    branches:
      - codex/research-preview

permissions:
  contents: read

concurrency:
  group: research-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install PDF extraction dependency
        run: python -m pip install -r scripts/research/requirements.txt
      - name: Lint
        run: npm run lint
      - name: Run research logic tests
        run: npm test
      - name: Run monitor and intake tests
        run: npm run test:python
      - name: Build Next.js preview
        run: npm run build
